<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사업자정보확인 — RichLink</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#C8A044; --gold-deep:#A8842E; --black:#111111; --mist:#F5F5F5; --stone:#8A8580; --line:#E7E4DE; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Pretendard',-apple-system,sans-serif; color:var(--black); background:#fff; -webkit-font-smoothing:antialiased;}
  a{text-decoration:none; color:inherit;}
  header{border-bottom:1px solid var(--line); padding:18px 32px;}
  .logo{font-family:'Playfair Display',serif; font-weight:600; font-size:20px;}
  .logo .link{color:var(--gold);}
  .wrap{max-width:640px; margin:0 auto; padding:56px 32px 100px;}
  .eyebrow{font-size:12px; letter-spacing:3px; color:var(--gold-deep); font-weight:600; margin-bottom:14px;}
  h1{font-family:'Playfair Display',serif; font-size:28px; font-weight:600; margin-bottom:32px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  tr{border-bottom:1px solid var(--line);}
  th, td{padding:14px 4px; text-align:left; vertical-align:top;}
  th{width:140px; color:var(--stone); font-weight:500;}
  td{font-weight:600;}
  .badge{
    display:inline-flex; align-items:center; gap:6px; margin-top:36px; padding:12px 16px; background:var(--mist);
    border-radius:8px; font-size:12.5px; color:#555;
  }
  .badge .dot{width:8px; height:8px; border-radius:50%; background:#2E9E5B;}
  .back{display:inline-block; margin-top:40px; font-size:13px; color:var(--gold-deep); font-weight:600;}
</style>
</head>
<body>
<header><a class="logo" href="prototype.html">Rich<span class="link">Link</span></a></header>
<div class="wrap">
  <p class="eyebrow">BUSINESS INFORMATION</p>
  <h1>사업자정보확인</h1>

  <table>
    <tr><th>상호명</th><td>(주)리치디앤씨</td></tr>
    <tr><th>대표자</th><td>김리치</td></tr>
    <tr><th>사업자등록번호</th><td>123-45-67890</td></tr>
    <tr><th>통신판매업신고</th><td>제2026-서울강남-01234호</td></tr>
    <tr><th>사업장 소재지</th><td>서울특별시 강남구 테헤란로 123, 10층</td></tr>
    <tr><th>고객센터</th><td>1544-0000</td></tr>
    <tr><th>이메일</th><td>help@richlink.co.kr</td></tr>
  </table>

  <div class="badge"><span class="dot"></span> 사업자 정보는 국세청 홈택스에서도 조회하실 수 있습니다.</div>

  <p style="margin-top:24px; color:var(--stone); font-size:12.5px;">※ 본 페이지는 데모용 예시 정보입니다. 실제 서비스 운영 시 실사업자 정보로 교체해야 합니다.</p>

  <a class="back" href="prototype.html">← 홈으로</a>
</div>
</body>
</html>

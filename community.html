<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤니티 — RichLink</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#C8A044; --gold-deep:#A8842E; --black:#111111; --mist:#F5F5F5; --stone:#8A8580; --line:#E7E4DE; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Pretendard',-apple-system,sans-serif; color:var(--black); background:#fff; -webkit-font-smoothing:antialiased;}
  a{text-decoration:none; color:inherit;} button{font-family:inherit; cursor:pointer; border:none; background:none;}
  input, textarea, select{font-family:inherit;}

  header{position:sticky; top:0; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); z-index:10;}
  .header-inner{max-width:900px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between;}
  .logo{font-family:'Playfair Display',serif; font-weight:600; font-size:20px;}
  .logo .link{color:var(--gold);}
  .back{font-size:13px; color:#555;}
  .back:hover{color:var(--gold-deep);}

  .hero{max-width:900px; margin:0 auto; padding:48px 24px 8px; text-align:center;}
  .eyebrow{font-size:12px; letter-spacing:3px; color:var(--gold-deep); font-weight:600; margin-bottom:14px;}
  h1{font-family:'Playfair Display',serif; font-size:28px; font-weight:600; margin-bottom:10px;}
  .hero p{font-size:13.5px; color:#666;}

  .wrap{max-width:820px; margin:0 auto; padding:24px 24px 100px;}

  .toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
  .cat-tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .cat-tab{padding:8px 16px; border-radius:999px; font-size:13px; border:1px solid var(--line); color:#555; transition:all .2s ease;}
  .cat-tab.active{background:var(--black); color:#fff; border-color:var(--black);}
  .write-btn{background:var(--gold); color:#fff; padding:9px 18px; border-radius:6px; font-size:13px; font-weight:600; transition:background .2s ease; flex-shrink:0;}
  .write-btn:hover{background:var(--gold-deep);}

  .post-list{border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .post-row{display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s ease;}
  .post-row:last-child{border-bottom:none;}
  .post-row:hover{background:#FBF9F4;}
  .post-cat{
    flex-shrink:0; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; color:#fff;
  }
  .post-cat.free{background:#8A8580;} .post-cat.review{background:var(--gold);} .post-cat.qna{background:#4E7FD1;} .post-cat.notice{background:#B0362F;}
  .post-main{flex:1; min-width:0;}
  .post-title{font-size:14px; font-weight:600; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .post-meta{font-size:11.5px; color:var(--stone);}
  .post-stats{flex-shrink:0; font-size:11.5px; color:var(--stone); text-align:right;}

  .empty{padding:80px 20px; text-align:center; color:var(--stone); font-size:13px;}

  .pagination{display:flex; justify-content:center; gap:6px; margin-top:20px;}
  .page-btn{
    width:34px; height:34px; border-radius:6px; border:1px solid var(--line); font-size:13px; color:#555;
    transition:all .15s ease;
  }
  .page-btn:hover:not(:disabled){border-color:var(--gold); color:var(--gold-deep);}
  .page-btn.active{background:var(--black); color:#fff; border-color:var(--black);}
  .page-btn:disabled{opacity:.35; cursor:not-allowed;}

  .write-box{border:1px solid var(--line); border-radius:10px; padding:24px; margin-bottom:20px;}
  .write-box h3{font-family:'Playfair Display',serif; font-size:18px; margin-bottom:18px;}
  .f-field{margin-bottom:14px;}
  .f-field label{display:block; font-size:12.5px; color:#555; margin-bottom:6px;}
  .f-field input, .f-field select, .f-field textarea{
    width:100%; border:1px solid var(--line); border-radius:5px; padding:10px 12px; font-size:13.5px; outline:none;
  }
  .f-field input:focus, .f-field select:focus, .f-field textarea:focus{border-color:var(--gold);}
  .f-field textarea{height:160px; resize:none;}
  .f-field .hint{font-size:11px; color:var(--stone); margin-top:5px;}
  .f-row{display:flex; gap:12px;}
  .f-row .f-field{flex:1;}
  .write-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}
  .btn-ghost{padding:10px 18px; border:1px solid var(--line); border-radius:5px; font-size:13px; color:#555;}
  .btn-solid{padding:10px 20px; border-radius:5px; font-size:13px; font-weight:600; background:var(--gold); color:#fff; transition:background .2s ease;}
  .btn-solid:hover{background:var(--gold-deep);}

  .detail-box{border:1px solid var(--line); border-radius:10px; padding:28px;}
  .detail-cat{display:inline-block; margin-bottom:10px;}
  .detail-head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .detail-title{font-size:20px; font-weight:700; margin-bottom:10px; line-height:1.4;}
  .detail-meta{font-size:12px; color:var(--stone); padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .detail-content{font-size:14px; line-height:1.9; color:#333; white-space:pre-line; min-height:100px;}
  .post-attached-image{width:100%; max-height:420px; object-fit:cover; border-radius:8px; margin-bottom:18px; display:block;}
  .video-embed{position:relative; width:100%; padding-top:56.25%; margin:14px 0; border-radius:8px; overflow:hidden; background:#000;}
  .video-embed iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .video-embed-native{width:100%; max-height:420px; border-radius:8px; margin:14px 0; display:block; background:#000;}
  .detail-actions{display:flex; gap:14px; flex-shrink:0;}
  .detail-actions a{font-size:12px; color:var(--stone); font-weight:600;}
  .detail-actions a:hover{color:var(--gold-deep);}
  .detail-actions a.report{color:#B0362F;}

  .comments{margin-top:28px; padding-top:22px; border-top:1px solid var(--line);}
  .comments h4{font-size:13.5px; font-weight:700; margin-bottom:14px;}
  .comment-item{padding:12px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .comment-item:last-child{border-bottom:none;}
  .comment-author{font-weight:600; margin-right:8px;}
  .comment-date{font-size:11px; color:var(--stone);}
  .comment-form{display:flex; gap:8px; margin-top:16px;}
  .comment-form input{flex:1; border:1px solid var(--line); border-radius:5px; padding:9px 12px; font-size:13px; outline:none;}
  .comment-form input:focus{border-color:var(--gold);}
  .comment-form button{background:var(--black); color:#fff; padding:0 18px; border-radius:5px; font-size:12.5px; font-weight:600;}

  /* ---- 모달(비밀번호 확인 / 신고하기) ---- */
  .cm-overlay{
    display:none; position:fixed; inset:0; background:rgba(17,17,17,.55); z-index:2000;
    align-items:center; justify-content:center; padding:20px;
  }
  .cm-overlay.show{display:flex;}
  .cm-box{background:#fff; border-radius:12px; padding:28px 26px; max-width:380px; width:100%; box-shadow:0 24px 60px rgba(17,17,17,.3);}
  .cm-box h3{font-family:'Playfair Display',serif; font-size:17px; font-weight:700; margin-bottom:16px;}
  .cm-actions{display:flex; gap:10px; margin-top:16px;}
  .cm-actions button{flex:1; padding:11px; border-radius:6px; font-size:13px;}
  .cm-actions .cancel{border:1px solid var(--line); color:#555;}
  .cm-actions .confirm{background:var(--gold); color:#fff; font-weight:600;}
  .cm-actions .confirm:hover{background:var(--gold-deep);}
  .cm-actions .confirm.danger{background:#B0362F;}
  .cm-actions .confirm.danger:hover{background:#8f2b25;}

  @media (max-width:600px){
    .toolbar{flex-direction:column; align-items:stretch;}
    .write-btn{width:100%;}
    .f-row{flex-direction:column; gap:0;}
    .post-stats{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="prototype.html">Rich<span class="link">Link</span></a>
    <a class="back" href="prototype.html">← 홈으로</a>
  </div>
</header>

<div class="hero">
  <p class="eyebrow">COMMUNITY</p>
  <h1>커뮤니티</h1>
  <p>분양 후기와 정보를 자유롭게 나눠보세요.</p>
</div>

<div class="wrap">
  <div id="listView">
    <div class="toolbar">
      <div class="cat-tabs">
        <div class="cat-tab active" onclick="setCategoryFilter(this,'all')">전체</div>
        <div class="cat-tab" onclick="setCategoryFilter(this,'notice')">공지사항</div>
        <div class="cat-tab" onclick="setCategoryFilter(this,'free')">자유게시판</div>
        <div class="cat-tab" onclick="setCategoryFilter(this,'review')">분양후기</div>
        <div class="cat-tab" onclick="setCategoryFilter(this,'qna')">질문답변</div>
      </div>
      <button class="write-btn" onclick="showWriteForm()">+ 글쓰기</button>
    </div>

    <div id="writeBox" style="display:none;"></div>

    <div class="post-list" id="postList"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div id="detailView" style="display:none;"></div>
</div>

<div id="pwModal" class="cm-overlay">
  <div class="cm-box">
    <h3 id="pwModalTitle">비밀번호 확인</h3>
    <div class="f-field">
      <label>글쓰기 시 설정한 비밀번호를 입력해주세요</label>
      <input type="password" id="pwModalInput" onkeydown="if(event.key==='Enter') confirmPasswordModal()">
    </div>
    <p class="field-error" id="err-pw" style="color:#C0392B; font-size:12px;"></p>
    <div class="cm-actions">
      <button class="cancel" onclick="closePasswordModal()">취소</button>
      <button class="confirm" onclick="confirmPasswordModal()">확인</button>
    </div>
  </div>
</div>

<div id="reportModal" class="cm-overlay">
  <div class="cm-box" style="max-width:420px;">
    <h3>신고하기</h3>
    <div class="f-field">
      <label>신고 사유</label>
      <select id="reportReason">
        <option value="스팸/광고">스팸/광고</option>
        <option value="명예훼손/욕설">명예훼손/욕설</option>
        <option value="허위사실">허위사실</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="f-field">
      <label>상세 내용</label>
      <textarea id="reportDetail" style="height:90px;" placeholder="신고 사유를 구체적으로 적어주세요"></textarea>
    </div>
    <div class="f-field">
      <label>증거자료 첨부 (선택, 이미지)</label>
      <input type="file" id="reportEvidence" accept="image/*" onchange="previewReportEvidence(event)">
      <div id="reportEvidencePreview" style="margin-top:8px;"></div>
    </div>
    <p class="field-error" id="err-report" style="color:#C0392B; font-size:12px;"></p>
    <div class="cm-actions">
      <button class="cancel" onclick="closeReportModal()">취소</button>
      <button class="confirm danger" onclick="submitReport()">신고 제출</button>
    </div>
  </div>
</div>

<script>
  const CAT_LABEL = { free: '자유게시판', review: '분양후기', qna: '질문답변', notice: '공지사항' };
  const CAT_CLASS = { free: 'free', review: 'review', qna: 'qna', notice: 'notice' };

  function getSession(){
    try{ return JSON.parse(sessionStorage.getItem('richlink_session') || 'null'); }catch(e){ return null; }
  }
  function isAdminSession(){
    const s = getSession();
    return !!(s && s.role === 'admin');
  }

  function loadBlockedAuthors(){
    try{ return JSON.parse(localStorage.getItem('richlink_blocked_authors') || '[]'); }catch(e){ return []; }
  }
  function isAuthorBlocked(name){
    return loadBlockedAuthors().includes(name);
  }

  const SEED_POSTS = [
    {
      id: 'p1', category: 'review', title: '강남 리치타워 더 퍼스트 모델하우스 다녀온 후기',
      author: '김민수', date: '2026-07-10', views: 214,
      content: '지난 주말에 모델하우스 다녀왔는데 커뮤니티 시설이 정말 잘 되어있더라구요. 84A 타입 3Bay 구조가 채광이 좋았습니다. 담당자분도 친절하게 설명해주셔서 좋았어요.',
      comments: [{ author: '이수진', date: '2026-07-11', content: '오 저도 가보려고 했는데 후기 감사해요!' }],
    },
    {
      id: 'p2', category: 'qna', title: '중도금 대출 관련 질문있습니다',
      author: '박지훈', date: '2026-07-08', views: 156,
      content: '기존 주택담보대출이 있는 상태인데 중도금 집단대출이 가능할까요? 비슷한 경험 있으신 분 계신가요?',
      comments: [],
    },
    {
      id: 'p3', category: 'free', title: '요즘 동탄 쪽 분양 많이 나오네요',
      author: '최영희', date: '2026-07-05', views: 98,
      content: '동탄2신도시 쪽으로 분양이 계속 나오고 있어서 관심있게 보고 있습니다. 다들 어느 현장 관심있으신가요?',
      comments: [],
    },
  ];

  function loadPosts(){
    try{
      const saved = JSON.parse(localStorage.getItem('richlink_community_posts') || 'null');
      return saved || SEED_POSTS;
    }catch(e){ return SEED_POSTS; }
  }
  function savePosts(posts){
    localStorage.setItem('richlink_community_posts', JSON.stringify(posts));
  }
  let posts = loadPosts();
  let categoryFilter = 'all';

  const POSTS_PER_PAGE = 20;
  let currentPage = 1;

  function setCategoryFilter(el, cat){
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    categoryFilter = cat;
    currentPage = 1;
    renderPostList();
  }

  function renderPostList(){
    const wrap = document.getElementById('postList');
    const filtered = categoryFilter === 'all' ? posts : posts.filter(p => p.category === categoryFilter);

    // 공지사항은 페이지 구분 없이 항상 전체 노출(일자순), 그 외 글만 20개 단위로 페이징합니다.
    const notices = filtered.filter(p => p.category === 'notice').sort((a,b) => new Date(b.date) - new Date(a.date));
    const others = filtered.filter(p => p.category !== 'notice').sort((a,b) => new Date(b.date) - new Date(a.date));

    if(notices.length === 0 && others.length === 0){
      wrap.innerHTML = '<div class="empty">등록된 게시글이 없습니다. 첫 글을 남겨보세요!</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    const totalPages = Math.max(1, Math.ceil(others.length / POSTS_PER_PAGE));
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const pageItems = others.slice(start, start + POSTS_PER_PAGE);

    function renderRow(p){
      return `
      <div class="post-row" onclick="openPost('${p.id}')">
        <span class="post-cat ${CAT_CLASS[p.category]}">${CAT_LABEL[p.category]}</span>
        <div class="post-main">
          <div class="post-title">${p.category === 'notice' ? '📌 ' : ''}${p.image ? '🖼 ' : ''}${p.title}</div>
          <div class="post-meta">${isAuthorBlocked(p.author) ? '[차단된 사용자]' : p.author} · ${p.date}</div>
        </div>
        <div class="post-stats">조회 ${p.views}<br>댓글 ${(p.comments||[]).length}</div>
      </div>
    `;
    }

    // 공지사항은 1페이지에서만 노출합니다 (2페이지 이후에는 공지 없이 일반 글만).
    const noticesToShow = currentPage === 1 ? notices : [];
    wrap.innerHTML = noticesToShow.map(renderRow).join('') + pageItems.map(renderRow).join('');

    renderPagination(totalPages);
  }

  function renderPagination(totalPages){
    const wrap = document.getElementById('pagination');
    if(!wrap) return;
    if(totalPages <= 1){ wrap.innerHTML = ''; return; }

    let html = `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goToPage(${currentPage-1})">‹</button>`;
    for(let i = 1; i <= totalPages; i++){
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" ${currentPage===totalPages?'disabled':''} onclick="goToPage(${currentPage+1})">›</button>`;
    wrap.innerHTML = html;
  }

  function goToPage(page){
    currentPage = page;
    renderPostList();
    document.getElementById('listView').scrollIntoView({ behavior:'smooth', block:'start' });
  }

  let editingPostId = null;

  function showWriteForm(editPost){
    editingPostId = editPost ? editPost.id : null;
    pendingWriteImage = editPost ? (editPost.image || null) : null;
    const box = document.getElementById('writeBox');
    box.style.display = 'block';
    const noticeOption = isAdminSession() ? `<option value="notice">공지사항 (관리자 전용)</option>` : '';
    box.innerHTML = `
      <div class="write-box">
        <h3>${editPost ? '글 수정' : '새 글쓰기'}</h3>
        <div class="f-row">
          <div class="f-field">
            <label>카테고리</label>
            <select id="wCategory">
              <option value="free">자유게시판</option>
              <option value="review">분양후기</option>
              <option value="qna">질문답변</option>
              ${noticeOption}
            </select>
          </div>
          <div class="f-field">
            <label>작성자 이름</label>
            <input type="text" id="wAuthor" placeholder="닉네임 또는 이름" ${editPost ? 'readonly' : ''}>
          </div>
        </div>
        <div class="f-field">
          <label>제목</label>
          <input type="text" id="wTitle" placeholder="제목을 입력하세요">
        </div>
        <div class="f-field">
          <label>내용</label>
          <textarea id="wContent" placeholder="내용을 입력하세요"></textarea>
          <p class="hint">유튜브·Vimeo 등 동영상 링크를 붙여넣으면 글에서 바로 재생됩니다. (동영상 파일 첨부는 지원하지 않습니다)</p>
        </div>
        <div class="f-field">
          <label>이미지 첨부 (선택, 3MB 이하 jpg/png)</label>
          <input type="file" id="wImageInput" accept="image/jpeg,image/jpg,image/png" onchange="handleWriteImage(event)">
          <div id="wImagePreview" style="margin-top:8px;"></div>
        </div>
        ${!editPost ? `
        <div class="f-field">
          <label>비밀번호</label>
          <input type="password" id="wPassword" placeholder="글 수정/삭제 시 필요한 비밀번호">
          <p class="hint">나중에 이 글을 수정하거나 삭제할 때 필요합니다. 잊지 않도록 기억해주세요.</p>
        </div>
        ` : ''}
        <p class="field-error" id="err-write" style="color:#C0392B; font-size:12px; margin-bottom:8px;"></p>
        <div class="write-actions">
          <button class="btn-ghost" onclick="hideWriteForm()">취소</button>
          <button class="btn-solid" onclick="submitPost()">${editPost ? '수정 완료' : '등록하기'}</button>
        </div>
      </div>
    `;
    if(editPost){
      document.getElementById('wCategory').value = editPost.category;
      document.getElementById('wAuthor').value = editPost.author;
      document.getElementById('wTitle').value = editPost.title;
      document.getElementById('wContent').value = editPost.content;
      if(editPost.image){
        pendingWriteImage = editPost.image;
        renderWriteImagePreview();
      }
    }
    box.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  let pendingWriteImage = null;

  function handleWriteImage(e){
    const file = e.target.files[0];
    const errEl = document.getElementById('err-write');
    if(!file) return;

    const MAX_SIZE = 3 * 1024 * 1024;
    const ALLOWED = ['image/jpeg', 'image/jpg', 'image/png'];
    if(!ALLOWED.includes(file.type)){
      errEl.textContent = '이미지는 jpg 또는 png 파일만 첨부할 수 있습니다.';
      e.target.value = '';
      return;
    }
    if(file.size > MAX_SIZE){
      errEl.textContent = '이미지는 3MB 이하만 첨부할 수 있습니다.';
      e.target.value = '';
      return;
    }
    errEl.textContent = '';

    const reader = new FileReader();
    reader.onload = (ev) => {
      pendingWriteImage = ev.target.result;
      renderWriteImagePreview();
    };
    reader.readAsDataURL(file);
  }

  function renderWriteImagePreview(){
    const box = document.getElementById('wImagePreview');
    if(!box) return;
    if(!pendingWriteImage){
      box.innerHTML = '';
      return;
    }
    box.innerHTML = `
      <div style="position:relative; display:inline-block;">
        <img src="${pendingWriteImage}" style="max-width:160px; max-height:120px; border-radius:6px; border:1px solid var(--line); display:block;">
        <button type="button" onclick="removeWriteImage()" style="position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; background:var(--black); color:#fff; font-size:13px; line-height:24px; text-align:center; box-shadow:0 2px 6px rgba(0,0,0,.3);">✕</button>
      </div>
    `;
  }

  function removeWriteImage(){
    pendingWriteImage = null;
    const input = document.getElementById('wImageInput');
    if(input) input.value = '';
    document.getElementById('err-write').textContent = '';
    renderWriteImagePreview();
  }

  function hideWriteForm(){
    document.getElementById('writeBox').style.display = 'none';
    document.getElementById('writeBox').innerHTML = '';
    editingPostId = null;
    pendingWriteImage = null;
  }

  function loadBannedKeywords(){
    try{ return JSON.parse(localStorage.getItem('richlink_banned_keywords') || 'null') || ['도박','카지노','대출광고','토토']; }catch(e){ return []; }
  }

  function submitPost(){
    const category = document.getElementById('wCategory').value;
    const author = document.getElementById('wAuthor').value.trim();
    const title = document.getElementById('wTitle').value.trim();
    const content = document.getElementById('wContent').value.trim();
    const errEl = document.getElementById('err-write');

    if(!author || !title || !content){
      errEl.textContent = '작성자 / 제목 / 내용을 모두 입력해주세요.';
      return;
    }

    if(isAuthorBlocked(author)){
      errEl.textContent = '이용이 제한된 사용자입니다. 게시글을 작성할 수 없습니다.';
      return;
    }

    if(category === 'notice' && !isAdminSession()){
      errEl.textContent = '공지사항은 관리자만 작성할 수 있습니다.';
      return;
    }

    const combined = (title + ' ' + content).toLowerCase();
    const hit = loadBannedKeywords().find(k => combined.includes(k.toLowerCase()));
    if(hit){
      errEl.textContent = `게시할 수 없는 단어("${hit}")가 포함되어 있습니다. 내용을 수정해주세요.`;
      return;
    }

    if(editingPostId){
      const idx = posts.findIndex(p => p.id === editingPostId);
      if(idx > -1){
        posts[idx] = { ...posts[idx], category, title, content, image: pendingWriteImage };
      }
      savePosts(posts);
      hideWriteForm();
      renderPostDetail(editingPostId);
      return;
    }

    const password = document.getElementById('wPassword').value;
    if(!password){
      errEl.textContent = '비밀번호를 입력해주세요. (수정/삭제 시 필요합니다)';
      return;
    }

    const newPost = {
      id: 'p' + Date.now(),
      category, title, content, author, password,
      image: pendingWriteImage,
      date: new Date().toISOString().slice(0,10),
      views: 0,
      comments: [],
    };
    posts.unshift(newPost);
    savePosts(posts);
    hideWriteForm();
    renderPostList();
  }

  function openPost(id){
    const target = '#/post/' + id;
    if(location.hash === target){
      renderPostDetail(id);
    } else {
      location.hash = target;
    }
  }

  function renderPostDetail(id){
    const post = posts.find(p => p.id === id);
    if(!post) return;
    post.views += 1;
    savePosts(posts);

    document.getElementById('listView').style.display = 'none';
    const detail = document.getElementById('detailView');
    detail.style.display = 'block';
    const displayAuthor = isAuthorBlocked(post.author) ? '[차단된 사용자]' : post.author;
    detail.innerHTML = `
      <a class="back" href="#" onclick="closePost();return false;">← 목록으로</a>
      <div class="detail-box" style="margin-top:16px;">
        <div class="detail-head-row">
          <span class="post-cat ${CAT_CLASS[post.category]} detail-cat">${CAT_LABEL[post.category]}</span>
          <div class="detail-actions">
            <a href="#" onclick="requestEdit('${post.id}');return false;">수정</a>
            <a href="#" onclick="requestDelete('${post.id}');return false;">삭제</a>
            <a href="#" class="report" onclick="openReportModal('${post.id}');return false;">신고하기</a>
          </div>
        </div>
        <div class="detail-title">${post.title}</div>
        <div class="detail-meta">${displayAuthor} · ${post.date} · 조회 ${post.views}</div>
        ${post.image ? `<img src="${post.image}" class="post-attached-image" alt="첨부 이미지">` : ''}
        <div class="detail-content">${renderContentWithMedia(post.content)}</div>

        <div class="comments">
          <h4>댓글 ${post.comments.length}</h4>
          <div id="commentList">
            ${post.comments.map(c => `
              <div class="comment-item"><span class="comment-author">${isAuthorBlocked(c.author) ? '[차단된 사용자]' : c.author}</span><span class="comment-date">${c.date}</span><div style="margin-top:4px;">${c.content}</div></div>
            `).join('') || '<p style="font-size:12.5px; color:var(--stone);">아직 댓글이 없습니다.</p>'}
          </div>
          <div class="comment-form">
            <input type="text" id="commentAuthor" placeholder="이름" style="max-width:110px;">
            <input type="text" id="commentContent" placeholder="댓글을 입력하세요" onkeydown="if(event.key==='Enter') submitComment('${post.id}')">
            <button onclick="submitComment('${post.id}')">등록</button>
          </div>
        </div>
      </div>
    `;
    window.scrollTo(0,0);
  }

  /* ---------- 비밀번호 확인 (수정/삭제 인증) ---------- */
  let pwPendingPostId = null;
  let pwPendingAction = null; // 'edit' | 'delete'

  function requestEdit(postId){
    if(isAdminSession()){ // 관리자는 비밀번호 없이 바로 수정 가능
      const post = posts.find(p => p.id === postId);
      if(post) showWriteForm(post);
      return;
    }
    pwPendingPostId = postId;
    pwPendingAction = 'edit';
    document.getElementById('pwModalTitle').textContent = '비밀번호 확인 (수정)';
    document.getElementById('pwModalInput').value = '';
    document.getElementById('err-pw').textContent = '';
    document.getElementById('pwModal').classList.add('show');
  }

  function requestDelete(postId){
    if(isAdminSession()){
      if(!confirm('이 게시글을 삭제하시겠습니까? (관리자 권한)')) return;
      deletePostById(postId);
      return;
    }
    pwPendingPostId = postId;
    pwPendingAction = 'delete';
    document.getElementById('pwModalTitle').textContent = '비밀번호 확인 (삭제)';
    document.getElementById('pwModalInput').value = '';
    document.getElementById('err-pw').textContent = '';
    document.getElementById('pwModal').classList.add('show');
  }

  function closePasswordModal(){
    document.getElementById('pwModal').classList.remove('show');
    pwPendingPostId = null;
    pwPendingAction = null;
  }

  function confirmPasswordModal(){
    const post = posts.find(p => p.id === pwPendingPostId);
    const entered = document.getElementById('pwModalInput').value;
    if(!post || entered !== post.password){
      document.getElementById('err-pw').textContent = '비밀번호가 일치하지 않습니다.';
      return;
    }
    const action = pwPendingAction;
    const postId = pwPendingPostId;
    closePasswordModal();

    if(action === 'edit') showWriteForm(post);
    if(action === 'delete'){
      if(confirm('이 게시글을 삭제하시겠습니까?')) deletePostById(postId);
    }
  }

  function deletePostById(postId){
    posts = posts.filter(p => p.id !== postId);
    savePosts(posts);
    closePost();
  }

  /* ---------- 신고하기 ---------- */
  let reportTargetPostId = null;
  let reportEvidenceData = null;

  function openReportModal(postId){
    reportTargetPostId = postId;
    reportEvidenceData = null;
    document.getElementById('reportReason').value = '스팸/광고';
    document.getElementById('reportDetail').value = '';
    document.getElementById('reportEvidence').value = '';
    document.getElementById('reportEvidencePreview').innerHTML = '';
    document.getElementById('err-report').textContent = '';
    document.getElementById('reportModal').classList.add('show');
  }

  function closeReportModal(){
    document.getElementById('reportModal').classList.remove('show');
    reportTargetPostId = null;
  }

  function previewReportEvidence(e){
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      document.getElementById('err-report').textContent = '이미지 파일만 첨부할 수 있습니다.';
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      reportEvidenceData = ev.target.result;
      document.getElementById('reportEvidencePreview').innerHTML =
        `<img src="${reportEvidenceData}" style="max-width:100%; max-height:140px; border-radius:6px; border:1px solid var(--line);">`;
    };
    reader.readAsDataURL(file);
  }

  function loadReports(){
    try{ return JSON.parse(localStorage.getItem('richlink_community_reports') || '[]'); }catch(e){ return []; }
  }
  function saveReports(reports){
    localStorage.setItem('richlink_community_reports', JSON.stringify(reports));
  }

  function submitReport(){
    const post = posts.find(p => p.id === reportTargetPostId);
    if(!post) return;
    const reason = document.getElementById('reportReason').value;
    const detailText = document.getElementById('reportDetail').value.trim();
    const errEl = document.getElementById('err-report');

    if(!detailText){
      errEl.textContent = '상세 내용을 입력해주세요.';
      return;
    }

    const reports = loadReports();
    reports.unshift({
      id: 'rp' + Date.now(),
      postId: post.id,
      postTitle: post.title,
      postAuthor: post.author,
      reason,
      detail: detailText,
      evidence: reportEvidenceData,
      date: new Date().toISOString().slice(0,10),
      status: '대기',
    });
    saveReports(reports);
    closeReportModal();
    alert('신고가 접수되었습니다. 관리자 검토 후 처리됩니다.');
  }

  function renderContentWithMedia(content){
    if(!content) return '';
    let html = content;

    // 유튜브 링크 -> 임베드 플레이어
    html = html.replace(
      /https?:\/\/(?:www\.)?(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{6,})\S*/g,
      (m, videoId) => `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${videoId}" title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
    );

    // Vimeo 링크 -> 임베드 플레이어
    html = html.replace(
      /https?:\/\/(?:www\.)?vimeo\.com\/(\d+)\S*/g,
      (m, videoId) => `<div class="video-embed"><iframe src="https://player.vimeo.com/video/${videoId}" title="Vimeo video" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`
    );

    // 직접 동영상 파일 링크(.mp4 / .webm / .ogg) -> 네이티브 플레이어
    html = html.replace(
      /https?:\/\/\S+\.(?:mp4|webm|ogg)(\?\S*)?/gi,
      (m) => `<video class="video-embed-native" controls src="${m}"></video>`
    );

    return html;
  }

  function submitComment(postId){
    const post = posts.find(p => p.id === postId);
    if(!post) return;
    const author = document.getElementById('commentAuthor').value.trim() || '익명';
    const content = document.getElementById('commentContent').value.trim();
    if(!content) return;

    if(isAuthorBlocked(author)){
      alert('이용이 제한된 사용자입니다. 댓글을 작성할 수 없습니다.');
      return;
    }

    const hit = loadBannedKeywords().find(k => content.toLowerCase().includes(k.toLowerCase()));
    if(hit){
      alert(`댓글에 게시할 수 없는 단어("${hit}")가 포함되어 있습니다.`);
      return;
    }

    post.comments.push({ author, content, date: new Date().toISOString().slice(0,10) });
    savePosts(posts);
    renderPostDetail(postId);
  }

  function closePost(){
    if(location.hash){
      location.hash = '';
    } else {
      showListView();
    }
  }

  function showListView(){
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('detailView').innerHTML = '';
    document.getElementById('listView').style.display = 'block';
    renderPostList();
  }

  function handleRoute(){
    const hash = location.hash || '';
    if(hash.indexOf('#/post/') === 0){
      const id = decodeURIComponent(hash.replace('#/post/', ''));
      renderPostDetail(id);
    } else {
      showListView();
    }
  }
  window.addEventListener('hashchange', handleRoute);

  handleRoute();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">검색결과 — RichLink</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold: #C8A044;
    --gold-deep: #A8842E;
    --gold-soft: #E7D6AC;
    --black: #111111;
    --white: #FFFFFF;
    --mist: #F5F5F5;
    --stone: #8A8580;
    --line: #E7E4DE;
    --serif: 'Playfair Display', 'Noto Serif KR', serif;
    --sans: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:var(--sans); color:var(--black); background:var(--white); -webkit-font-smoothing:antialiased;}
  a{text-decoration:none; color:inherit;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  input{font-family:inherit;}

  header{
    position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1240px; margin:0 auto; padding:18px 32px; display:flex; align-items:center; justify-content:space-between;
  }
  .logo{font-family:var(--serif); font-weight:600; font-size:22px; letter-spacing:.5px; display:flex; align-items:baseline; gap:2px;}
  .logo .rich{color:var(--black);}
  .logo .link{color:var(--gold);}
  .header-right{display:flex; align-items:center; gap:14px;}
  .map-btn{
    padding:9px 16px; border:1px solid var(--gold); border-radius:2px; font-size:13px; font-weight:600;
    color:var(--gold-deep); transition:all .2s ease;
  }
  .map-btn:hover{background:var(--gold); color:#fff;}
  .visitor-counter{
    display:flex; align-items:center; gap:7px; font-size:13px; color:#555;
    padding:7px 14px; border:1px solid var(--line); border-radius:999px; background:var(--mist);
  }
  .visitor-counter b{color:var(--gold-deep); font-weight:700;}
  .visitor-dot{width:7px; height:7px; border-radius:50%; background:var(--gold); flex-shrink:0; animation:pulse 2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(200,160,68,.45);}
    70%{box-shadow:0 0 0 6px rgba(200,160,68,0);}
    100%{box-shadow:0 0 0 0 rgba(200,160,68,0);}
  }
  @media (max-width:520px){ .visitor-counter{display:none;} }
  @media (max-width:640px){
    .header-inner{padding:14px 18px;}
    .header-right{gap:8px;}
    .map-btn{font-size:12px; padding:8px 10px;}
    .results-topbar{padding:16px 18px; flex-wrap:wrap;}
    .results-searchbox{max-width:none; width:100%;}
    .results-body{padding:20px 18px;}
  }

  /* ---------- BANNER POPUP ---------- */
  .banner-popup-overlay{
    display:none; position:fixed; inset:0; background:rgba(17,17,17,.55); z-index:2000;
    align-items:center; justify-content:center; padding:20px;
  }
  .banner-popup-overlay.show{display:flex;}
  .banner-popup-box{
    background:#fff; border-radius:12px; overflow:hidden; max-width:420px; width:100%;
    box-shadow:0 24px 60px rgba(17,17,17,.3); animation:bannerPop .25s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes bannerPop{
    0%{ transform:scale(.94); opacity:0; } 100%{ transform:scale(1); opacity:1; }
  }
  .banner-popup-scroller{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
  }
  .banner-popup-scroller a, .banner-popup-scroller div.bp-slide{
    flex:0 0 100%; scroll-snap-align:start; display:block;
  }
  .banner-popup-scroller img{width:100%; height:280px; object-fit:cover; display:block;}
  .banner-popup-footer{
    display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-top:1px solid var(--line);
  }
  .banner-popup-checkbox{display:flex; align-items:center; gap:7px; font-size:12.5px; color:#555; cursor:pointer;}
  .banner-popup-checkbox input{accent-color:var(--gold); width:15px; height:15px;}
  .banner-popup-confirm{
    background:var(--black); color:#fff; padding:9px 20px; border-radius:6px; font-size:12.5px; font-weight:600; transition:background .2s ease;
  }
  .banner-popup-confirm:hover{background:var(--gold-deep);}

  /* ---------- 검색바 (재검색용, 홈의 큰 히어로와 다른 컴팩트 형태) ---------- */
  .results-topbar{
    border-bottom:1px solid var(--line); padding:20px 32px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .results-back{font-size:13px; color:#555; flex-shrink:0; transition:color .2s ease;}
  .results-back:hover{color:var(--gold-deep);}
  .results-searchbox{
    display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); border-radius:999px;
    padding:6px 6px 6px 18px; flex:1; max-width:480px; transition:border-color .2s ease;
  }
  .results-searchbox:focus-within{border-color:var(--gold);}
  .results-searchbox input{flex:1; border:none; outline:none; font-size:13.5px; padding:8px 0; background:transparent;}
  .results-searchbox button{
    width:32px; height:32px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:background .2s ease;
  }
  .results-searchbox button:hover{background:var(--gold-deep);}

  .results-body{
    max-width:1620px; margin:0 auto; display:grid; grid-template-columns:220px 1fr; gap:32px; padding:32px 24px;
  }
  @media (max-width:1400px){ .results-body{grid-template-columns:200px 1fr; gap:24px; padding:28px 20px;} }
  @media (max-width:860px){ .results-body{grid-template-columns:1fr;} }
  .filters{border-right:1px solid var(--line); padding-right:24px;}
  @media (max-width:860px){ .filters{display:none;} }
  .filter-group{margin-bottom:30px;}
  .filter-group h4{font-size:13px; font-weight:600; letter-spacing:.5px; margin-bottom:14px;}
  .filter-opt{display:flex; align-items:center; gap:8px; font-size:13.5px; color:#555; margin-bottom:10px; cursor:pointer;}
  .filter-opt input{accent-color:var(--gold); width:14px; height:14px;}
  .filter-opt:hover{color:var(--gold-deep);}

  .results-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .results-count{font-size:14px; color:#444;}
  .results-count b{color:var(--black);}

  .card-grid{display:grid; grid-template-columns:repeat(3, 380px); gap:24px; justify-content:start;}
  @media (max-width:1300px){ .card-grid{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width:860px){ .card-grid{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width:520px){ .card-grid{grid-template-columns:1fr;} }
  .card{
    width:380px; height:325px; display:flex; flex-direction:column;
    border:1px solid var(--line); border-radius:6px; overflow:hidden; cursor:pointer;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, border-color .3s ease; background:var(--white);
  }
  @media (max-width:1300px){ .card{width:100%;} }
  .card:hover{transform:translateY(-6px); box-shadow:0 18px 40px rgba(17,17,17,.10); border-color:transparent;}
  .card-thumb{height:190px; flex-shrink:0; position:relative; overflow:hidden; background:linear-gradient(135deg,#EDE7D8,#D9CBA3);}
  .badge{
    position:absolute; top:12px; left:12px; background:var(--gold); color:var(--white);
    font-size:11px; padding:5px 10px; border-radius:999px; letter-spacing:.3px; font-weight:600;
  }
  .card-body{padding:16px 16px 18px; flex:1; display:flex; flex-direction:column; min-height:0;}
  .card-loc{font-size:12px; color:var(--stone); margin-bottom:6px;}
  .card-title{
    font-size:16px; font-weight:600; margin-bottom:8px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-price{font-size:15px; color:var(--gold-deep); font-weight:700;}
  .empty-state{grid-column:1/-1; text-align:center; padding:100px 20px; color:var(--stone); line-height:1.8;}
  .empty-state p:first-child{font-size:15px; font-weight:600; color:var(--black); margin-bottom:6px;}

  footer.site-footer{border-top:1px solid var(--line); background:var(--mist);}
  .footer-inner{max-width:1240px; margin:0 auto; padding:44px 32px 32px;}
  .footer-logo{font-family:var(--serif); font-size:18px; font-weight:600; margin-bottom:22px; padding-bottom:22px; border-bottom:1px solid var(--line);}
  .footer-logo .link{color:var(--gold);}
  .footer-info{font-size:12px; color:#8A8580; line-height:2; display:flex; flex-wrap:wrap; gap:0 18px;}
  .footer-info b{color:#666; font-weight:600;}
  .footer-links{font-size:12px; color:#8A8580; margin-top:14px; display:flex; gap:16px;}
  .footer-links a:hover{color:var(--gold-deep);}
  .footer-copyright{font-size:11.5px; color:#B4AFA8; margin-top:18px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="prototype.html"><span class="rich">Rich</span><span class="link">Link</span></a>
    <div class="header-right">
      <a href="map.html" class="map-btn">🗺️ 지도현장</a>
      <div class="visitor-counter" title="오늘 방문자 수">
        <span class="visitor-dot"></span>
        오늘 방문자 <b id="visitorCount">0</b>명
      </div>
    </div>
  </div>
</header>

<div id="bannerPopupOverlay" class="banner-popup-overlay">
  <div class="banner-popup-box">
    <div class="banner-popup-scroller" id="bannerPopupScroller"></div>
    <div class="banner-popup-footer">
      <label class="banner-popup-checkbox">
        <input type="checkbox" id="bannerHideTodayCheckbox"> 오늘 하루 열지 않기
      </label>
      <button class="banner-popup-confirm" onclick="closeBannerPopup()">확인</button>
    </div>
  </div>
</div>

<div class="results-topbar">
  <a class="results-back" href="prototype.html">← 홈으로</a>
  <div class="results-searchbox">
    <input id="searchInput" type="text" placeholder="지역명 또는 분양명을 검색해보세요">
    <button onclick="submitSearch()" aria-label="검색">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="white" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<div class="results-body">
  <aside class="filters">
    <div class="filter-group">
      <h4>지역</h4>
      <label class="filter-opt"><input type="checkbox" name="regionFilter" value="서울"> 서울</label>
      <label class="filter-opt"><input type="checkbox" name="regionFilter" value="경기"> 경기</label>
      <label class="filter-opt"><input type="checkbox" name="regionFilter" value="인천"> 인천</label>
      <label class="filter-opt"><input type="checkbox" name="regionFilter" value="부산"> 부산</label>
    </div>
    <div class="filter-group">
      <h4>분양종류</h4>
      <label class="filter-opt"><input type="checkbox" name="typeFilter" value="아파트"> 아파트</label>
      <label class="filter-opt"><input type="checkbox" name="typeFilter" value="오피스텔"> 오피스텔</label>
    </div>
    <div class="filter-group">
      <h4>분양상태</h4>
      <label class="filter-opt"><input type="checkbox" name="statusFilter" value="분양예정"> 분양예정</label>
      <label class="filter-opt"><input type="checkbox" name="statusFilter" value="분양중"> 분양중</label>
    </div>
    <div class="filter-group">
      <h4>금액</h4>
      <label class="filter-opt"><input type="checkbox" name="priceRange" value="under5"> 5억 이하</label>
      <label class="filter-opt"><input type="checkbox" name="priceRange" value="5to10"> 5억~10억</label>
      <label class="filter-opt"><input type="checkbox" name="priceRange" value="10to20"> 10~20억</label>
      <label class="filter-opt"><input type="checkbox" name="priceRange" value="over20"> 20억 이상</label>
    </div>
  </aside>

  <div>
    <div class="results-header">
      <div class="results-count" id="resultsCountLabel">검색결과 <b id="resultCount">0</b>건</div>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-top" style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:22px; padding-bottom:22px; border-bottom:1px solid var(--line);">
      <div class="footer-logo" style="margin:0; padding:0; border:none;">Rich<span class="link">Link</span></div>
      <div style="display:flex; gap:18px; font-size:12.5px; color:#777;">
        <a href="new-listings.html">신규현장</a>
        <a href="map.html">지도현장</a>
        <a href="community.html">커뮤니티</a>
        <a href="faq.html">자주 묻는 질문</a>
      </div>
    </div>
    <div class="footer-info">
      <span><b>(주)리치디앤씨</b></span>
      <span>대표 김리치</span>
      <span>사업자등록번호 123-45-67890</span>
      <span>통신판매업신고 제2026-서울강남-01234호</span>
      <span>서울특별시 강남구 테헤란로 123, 10층</span>
      <span>고객센터 1544-0000</span>
      <span>이메일 help@richlink.co.kr</span>
    </div>
    <div class="footer-links">
      <a href="terms.html">이용약관</a>
      <a href="privacy.html">개인정보처리방침</a>
      <a href="biz-info.html">사업자정보확인</a>
    </div>
    <p class="footer-copyright">© 2026 RichLink Co., Ltd. All rights reserved.</p>
  </div>
</footer>

<script>
  const DEFAULT_LISTINGS = [
    {id:"d1", title:"강남 리치타워 더 퍼스트", loc:"서울 강남구 역삼동", price:"12.8억 ~ 18.5억", type:"아파트", status:"분양중", views:"12,402", likes:"834", approved:true, paid:true, thumbnail:null},
    {id:"d2", title:"송도 리치오션뷰 센트럴", loc:"인천 연수구 송도동", price:"6.2억 ~ 9.4억", type:"오피스텔", status:"분양예정", views:"8,120", likes:"512", approved:true, paid:true, thumbnail:null},
    {id:"d3", title:"용인 리치파크 스카이", loc:"경기 용인시 수지구", price:"5.5억 ~ 8.1억", type:"아파트", status:"분양중", views:"9,880", likes:"640", approved:true, paid:true, thumbnail:null},
    {id:"d4", title:"수원 리치스퀘어 지식산업센터", loc:"경기 수원시 영통구", price:"3.1억 ~ 5.9억", type:"지식산업센터", status:"분양중", views:"5,340", likes:"290", approved:true, paid:true, thumbnail:null},
    {id:"d5", title:"동탄 리치스트리트 상가", loc:"경기 화성시 동탄", price:"2.4억 ~ 4.7억", type:"상가", status:"분양중", views:"4,210", likes:"180", approved:true, paid:true, thumbnail:null},
    {id:"d6", title:"부산 리치마린 더뷰", loc:"부산 해운대구 우동", price:"7.8억 ~ 11.3억", type:"아파트", status:"분양예정", views:"11,050", likes:"720", approved:true, paid:true, thumbnail:null},
  ];

  function loadCustomListings(){
    try{ return JSON.parse(localStorage.getItem('richlink_custom_listings') || '[]'); }catch(e){ return []; }
  }

  const listings = [...loadCustomListings(), ...DEFAULT_LISTINGS];

  function getQueryParam(name){
    return new URLSearchParams(location.search).get(name) || '';
  }

  function submitSearch(){
    const q = document.getElementById('searchInput').value.trim();
    location.href = 'search.html' + (q ? ('?q=' + encodeURIComponent(q)) : '');
  }
  document.getElementById('searchInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') submitSearch(); });

  const PRICE_BUCKETS = {
    under5: [0, 5],
    '5to10': [5, 10],
    '10to20': [10, 20],
    over20: [20, Infinity],
  };

  function parsePriceRange(priceStr){
    const nums = (priceStr.match(/[\d.]+/g) || []).map(Number);
    if(nums.length === 0) return null;
    if(nums.length === 1) return [nums[0], nums[0]];
    return [nums[0], nums[1]];
  }

  function getSelectedPriceBuckets(){
    return Array.from(document.querySelectorAll('input[name="priceRange"]:checked')).map(el => el.value);
  }

  function matchesPriceBuckets(listing, selectedBuckets){
    if(selectedBuckets.length === 0) return true;
    const range = parsePriceRange(listing.price);
    if(!range) return false; // "가격 문의" 등 금액 정보가 없는 매물은 금액 필터 선택 시 제외됩니다.
    const [min, max] = range;
    return selectedBuckets.some(key => {
      const [bMin, bMax] = PRICE_BUCKETS[key];
      return min <= bMax && max >= bMin;
    });
  }

  document.querySelectorAll('input[name="priceRange"]').forEach(el => {
    el.addEventListener('change', renderResults);
  });

  function getSelectedValues(name){
    return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);
  }

  function matchesRegionFilter(listing, selectedRegions){
    if(selectedRegions.length === 0) return true;
    return selectedRegions.some(region => listing.loc.includes(region));
  }

  function matchesTypeFilter(listing, selectedTypes){
    if(selectedTypes.length === 0) return true;
    return selectedTypes.includes(listing.type);
  }

  function matchesStatusFilter(listing, selectedStatuses){
    if(selectedStatuses.length === 0) return true;
    return selectedStatuses.includes(listing.status);
  }

  document.querySelectorAll('input[name="regionFilter"], input[name="typeFilter"], input[name="statusFilter"]').forEach(el => {
    el.addEventListener('change', renderResults);
  });

  function renderResults(){
    const q = getQueryParam('q');
    document.getElementById('searchInput').value = q;
    document.getElementById('pageTitle').textContent = (q ? `"${q}" 검색결과` : '전체 분양') + ' — RichLink';

    const ql = q.trim().toLowerCase();
    const selectedBuckets = getSelectedPriceBuckets();
    const selectedRegions = getSelectedValues('regionFilter');
    const selectedTypes = getSelectedValues('typeFilter');
    const selectedStatuses = getSelectedValues('statusFilter');

    const filtered = listings.filter(l => {
      const matchesQuery = !ql ||
        l.title.toLowerCase().includes(ql) ||
        l.loc.toLowerCase().includes(ql) ||
        l.type.toLowerCase().includes(ql);
      return l.approved !== false
        && matchesQuery
        && matchesPriceBuckets(l, selectedBuckets)
        && matchesRegionFilter(l, selectedRegions)
        && matchesTypeFilter(l, selectedTypes)
        && matchesStatusFilter(l, selectedStatuses);
    });

    // 담당자가 배정된 현장(광고주)을 먼저 보여줍니다.
    filtered.sort((a, b) => (b.manager ? 1 : 0) - (a.manager ? 1 : 0));

    document.getElementById('resultCount').textContent = filtered.length;

    const grid = document.getElementById('cardGrid');
    if(filtered.length === 0){
      grid.innerHTML = `
        <div class="empty-state">
          <p>검색 결과가 없습니다</p>
          <p style="font-size:13px;">조건에 맞는 분양이 없습니다. 검색어나 금액 필터를 다시 확인해보세요.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = filtered.map(l => `
      <a class="card" href="prototype.html#/listing/${encodeURIComponent(l.id)}">
        <div class="card-thumb" style="${l.thumbnail ? `background-image:url('${l.thumbnail}');background-size:cover;background-position:center;` : ''}">
          <span class="badge">${l.status}</span>
          ${l.approved === false ? '<span class="badge" style="left:auto; right:12px; background:var(--black);">승인대기</span>' : ''}
        </div>
        <div class="card-body">
          <div class="card-loc">${l.loc}</div>
          <div class="card-title">${l.title}</div>
          <div class="card-price">${l.price}</div>
        </div>
      </a>
    `).join('');
  }

  function getLocalDateStr(d){
    d = d || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function renderVisitorCount(){
    const todayStr = getLocalDateStr();
    const todayKey = 'richlink_visits_' + todayStr;
    const totalKey = 'richlink_visits_total';
    const sessionFlagKey = 'richlink_counted_' + todayStr;

    let todayCount = Number(localStorage.getItem(todayKey) || '0');
    let totalCount = Number(localStorage.getItem(totalKey) || '0');

    if(!sessionStorage.getItem(sessionFlagKey)){
      todayCount += 1;
      totalCount += 1;
      localStorage.setItem(todayKey, String(todayCount));
      localStorage.setItem(totalKey, String(totalCount));
      sessionStorage.setItem(sessionFlagKey, '1');
    }

    document.getElementById('visitorCount').textContent = todayCount.toLocaleString('ko-KR');
  }

  function loadBanners(){
    try{ return JSON.parse(localStorage.getItem('richlink_banners') || '[]'); }catch(e){ return []; }
  }

  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }

  function showBannerPopup(){
    const active = loadBanners().filter(b => b.active).sort((a,b) => a.order - b.order);
    if(active.length === 0) return;

    // "오늘 하루 열지 않기" 체크 후 확인을 누르면 오늘 날짜가 저장되어, 같은 날에는 다시 뜨지 않습니다.
    const hideUntil = localStorage.getItem('richlink_banner_popup_hide_until');
    if(hideUntil === todayStr()) return;

    const scroller = document.getElementById('bannerPopupScroller');
    scroller.innerHTML = active.map(b => {
      const inner = `<img src="${b.image}" alt="배너">`;
      return b.link
        ? `<a href="${b.link}" target="_blank" rel="noopener">${inner}</a>`
        : `<div class="bp-slide">${inner}</div>`;
    }).join('');

    document.getElementById('bannerHideTodayCheckbox').checked = false;
    document.getElementById('bannerPopupOverlay').classList.add('show');
  }

  function closeBannerPopup(){
    if(document.getElementById('bannerHideTodayCheckbox').checked){
      localStorage.setItem('richlink_banner_popup_hide_until', todayStr());
    }
    document.getElementById('bannerPopupOverlay').classList.remove('show');
  }

  function logSearchTerm(term){
    term = (term || '').trim();
    if(!term) return;
    const key = 'richlink_search_log';
    let log = [];
    try{ log = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ log = []; }
    log.unshift({ term, date: getLocalDateStr() });
    // 로그가 무한히 커지지 않도록 최근 5,000건만 유지합니다.
    if(log.length > 5000) log = log.slice(0, 5000);
    localStorage.setItem(key, JSON.stringify(log));
  }

  renderResults();
  renderVisitorCount();
  showBannerPopup();
  logSearchTerm(getQueryParam('q'));
</script>

</body>
</html>
